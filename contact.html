
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TBB Framework | Founder</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
color:#ffffff;
font-family:Arial, sans-serif;
line-height:1.7;
}

section{
padding:70px 20px;
}

.container{
max-width:1100px;
margin:auto;
}

/* HERO */

.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
url('founder-hero.jpg');
background-size:cover;
background-position:center;
}

.hero-content{
max-width:850px;
}

.hero h1{
font-size:4rem;
color:#f4c542;
margin-bottom:15px;
letter-spacing:3px;
}

.hero h2{
font-size:1.8rem;
margin-bottom:25px;
}

.hero p{
color:#d8d8d8;
font-size:1.1rem;
margin-bottom:35px;
}

.cta-btn{
display:inline-block;
background:#f4c542;
color:#000;
padding:15px 35px;
border-radius:8px;
font-weight:bold;
text-decoration:none;
}

.cta-btn:hover{
opacity:.9;
}

/* SECTION HEADINGS */

.section-title{
text-align:center;
color:#f4c542;
font-size:2rem;
margin-bottom:30px;
}

/* FOUNDER IMAGE */

.founder-image-card{
background:#111;
border:2px solid #f4c542;
border-radius:20px;
padding:25px;
text-align:center;
}

.founder-image-placeholder{
height:450px;
display:flex;
align-items:center;
justify-content:center;
border:2px dashed #f4c542;
border-radius:15px;
color:#f4c542;
font-size:1.2rem;
}

/* CARDS */

.card{
background:#111;
border:1px solid #f4c542;
border-radius:15px;
padding:30px;
margin-bottom:25px;
}

.card p{
color:#d8d8d8;
}

/* PHILOSOPHY */

.quote-box{
background:#111;
border-left:6px solid #f4c542;
padding:30px;
font-size:1.2rem;
font-style:italic;
border-radius:10px;
}

/* PRINCIPLES */

.principles{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.principle{
background:#111;
border:1px solid #f4c542;
border-radius:15px;
padding:25px;
text-align:center;
}

/* CONTACT */

.contact-box{
background:#111;
