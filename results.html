
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Execution Metrics | TBB Framework</title>

<style>

body{
background:#000;
color:#fff;
font-family:Arial,sans-serif;
margin:0;
line-height:1.8;
}

.hero img{
width:100%;
display:block;
}

.hero-text{
text-align:center;
padding:60px 20px;
}

.hero-text h1{
color:#f5c542;
font-size:2.8rem;
margin-bottom:15px;
}

.hero-text p{
font-size:1.2rem;
color:#cccccc;
}

.section{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

.section-title{
font-size:2rem;
color:#f5c542;
margin-bottom:30px;
}

.metric-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
margin-top:30px;
}

.metric-card{
background:#111;
border:1px solid rgba(245,197,66,0.15);
border-radius:20px;
padding:30px;
text-align:center;
}

.metric-card h3{
font-size:1rem;
color:#cccccc;
margin-bottom:15px;
}

.metric-value{
font-size:3rem;
font-weight:bold;
color:#00aaff;
}

.metric-description{
font-size:0.95rem;
color:#999;
margin-top:15px;
}

.deployment-panel{
background:#111;
border:1px solid rgba(245,197,66,0.15);
border-radius:20px;
padding:40px;
text-align:center;
margin-top:25px;
}

.number-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:15px;
max-width:600px;
margin:auto;
margin-top:25px;
}

.number{
background:#000;
border:1px solid rgba(245,197,66,0.2);
padding:20px;
font-size:2rem;
color:#00ff66;
border-radius:12px;
}

.snapshot{
background:#111;
border-radius:20px;
padding:40px;
margin-top:30px;
}

.snapshot-row{
display:flex;
justify-content:space-between;
padding:15px 0;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.snapshot-row:last-child{
border-bottom:none;
}

.status-bar{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:30px;
}

.status-box{
background:#111;
border-radius:20px;
padding:25px;
text-align:center;
color:#00ff66;
font-weight:bold;
}

.footer-banner{
text-align:center;
padding:60px 20px;
font-size:1.4rem;
color:#f5c542;
letter-spacing:4px;
}

</style>
</head>

<body>

<section class="hero">

<img src="file_00000000cbd472439e3dfe0f694fa6db.png" alt="Execution Metrics">

</section>

</body>
</html>
