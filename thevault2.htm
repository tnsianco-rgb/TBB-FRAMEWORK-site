
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TBB Vault</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
--gold:#d4af37;
--black:#050505;
--white:#f5f5f5;
--panel:#0d0d0d;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:var(--black);
color:var(--white);
font-family:'Inter',sans-serif;
line-height:1.8;
}

.history-hero{
position:relative;
text-align:center;
}

.history-hero img{
width:100%;
display:block;
}

.hero-content{
padding:60px 20px;
max-width:900px;
margin:auto;
}

.hero-content h1{
font-family:'Cinzel',serif;
font-size:clamp(2rem,5vw,4rem);
color:var(--gold);
margin-bottom:20px;
}

.hero-content p{
color:#b8b8b8;
font-size:1.1rem;
}

.section{
max-width:1200px;
margin:auto;
padding:80px 20px;
}

.section h2{
font-family:'Cinzel',serif;
color:var(--gold);
text-align:center;
margin-bottom:30px;
}

.card{
background:rgba(255,255,255,0.02);
border:1px solid rgba(212,175,55,0.15);
border-radius:18px;
padding:40px;
margin-top:30px;
}

.card p{
color:#d0d0d0;
}

.treasury-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
margin-top:40px;
}

.treasury-card{
background:rgba(255,255,255,0.02);
border:1px solid rgba(212,175,55,0.15);
padding:30px;
border-radius:18px;
text-align:center;
}

.treasury-card h3{
color:var(--gold);
margin-bottom:15px;
}

.treasury-card p{
font-size:2rem;
font-weight:700;
}

</style>
</head>

<body>
